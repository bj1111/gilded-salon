<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<title>Gilded Salon</title>
		<style>
			/* Fonts ship with the game (SIL OFL); nothing is fetched from external hosts. */
			@font-face {
				font-family: 'Limelight';
				font-display: block;
				src: url('%sveltekit.assets%/assets/fonts/Limelight-latin.woff2') format('woff2');
				unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
			@font-face {
				font-family: 'Limelight';
				font-display: block;
				src: url('%sveltekit.assets%/assets/fonts/Limelight-latin-ext.woff2') format('woff2');
				unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
			}
			@font-face {
				font-family: 'Josefin Sans';
				font-weight: 100 700;
				font-display: block;
				src: url('%sveltekit.assets%/assets/fonts/JosefinSans-latin.woff2') format('woff2');
				unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
			@font-face {
				font-family: 'Josefin Sans';
				font-weight: 100 700;
				font-display: block;
				src: url('%sveltekit.assets%/assets/fonts/JosefinSans-latin-ext.woff2') format('woff2');
				unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
			}
			/* The SDK's HTML menus ask for 'proxima-nova' (a Typekit font); serve them Josefin Sans. */
			@font-face {
				font-family: 'proxima-nova';
				font-weight: 100 900;
				font-display: block;
				src: url('%sveltekit.assets%/assets/fonts/JosefinSans-latin.woff2') format('woff2');
			}
			html,
			body {
				margin: 0;
				padding: 0;
				overflow: hidden;
				overscroll-behavior: none;
				background-color: #0b0c0e;
				touch-action: manipulation;
				-webkit-tap-highlight-color: transparent;
				-webkit-user-select: none;
				user-select: none;
			}
			/* an inline canvas leaves a text-baseline gap below it, which made the page scroll */
			canvas {
				display: block;
			}
		</style>
		%sveltekit.head%
	</head>
	<body>
		<div>%sveltekit.body%</div>
	</body>
</html>
